[package]
name = "riverbit-mm-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Client SDK for market makers integrating with the RiverBit exchange API (REST and binary WebSocket)."
license = "Apache-2.0"
publish = false
readme = "README.md"
keywords = ["riverbit", "market-maker", "exchange", "websocket"]
categories = ["api-bindings", "finance"]

[lib]
name = "riverbit_mm_sdk"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
getrandom = "0.3"
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
